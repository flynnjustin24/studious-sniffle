name: Auto Fix
on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix

jobs:
  autofix:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: autofix
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_COMMITTER_NAME: cli automation
      GIT_AUTHOR_NAME: cli automation
      GIT_COMMITTER_EMAIL: noreply@github.com
      GIT_AUTHOR_EMAIL: noreply@github.com

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Run gofmt
        shell: bash
        run: gofmt -w $(git ls-files '*.go')

      - name: Run go mod tidy
        run: go mod tidy

      - name: Run golangci-lint autofix
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --fix

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if autofix found nothing usable
        if: steps.lint.outcome == 'failure' && steps.changes.outputs.has_changes != 'true'
        run: exit 1

      - name: Commit fixes
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "autofix: apply automated fixes"
          git push --force --set-upstream origin "$BRANCH_NAME"

      - name: Create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number')

          body=$(mktemp)
          cat > "$body" <<'EOF'
          ## Summary
          - apply automated formatting and lint fixes
          - refresh module metadata when needed

          ## Testing
          - not run
          EOF

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "autofix: apply automated fixes" \
              --body-file "$body"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "autofix: apply automated fixes" \
              --body-file "$body"
          fi
